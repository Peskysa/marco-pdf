name: Compilar y publicar colección
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - name: Verificar estándar de colección
        run: python scripts/distribution.py check
        working-directory: .
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.25.0'
          run_install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
      - name: Navegador y OCR sin red externa
        env:
          BROWSER_CHANNEL: chromium
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm exec vite preview --host 127.0.0.1 --port 5173 &
          for i in $(seq 1 20); do curl -s http://127.0.0.1:5173/ >/dev/null && break; sleep 1; done
          pnpm run test:browser
          node tests/offline.mjs
      - name: Empaquetar web normal
        run: |
          cp ../LICENSE ../NOTICE ../THIRD_PARTY.md dist/
          cp -R ../licenses dist/
          cd dist && zip -qr ../../Marco-PDF-Web.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: web-assets
          path: web/dist/
      - uses: actions/upload-artifact@v4
        with:
          name: final-web
          path: Marco-PDF-Web.zip
  desktop:
    needs: web
    strategy:
      matrix:
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: web-assets
          path: web/dist
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependencias Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk xvfb libxft2
      - run: python -m pip install -r requirements.txt pyinstaller==6.22.3
      - name: Idiomas OCR ES EN FR
        shell: python
        run: |
          import gzip, pathlib
          folder = pathlib.Path('tessdata'); folder.mkdir(exist_ok=True)
          for lang in ('spa', 'eng', 'fra'):
              (folder / f'{lang}.traineddata').write_bytes(gzip.decompress(pathlib.Path(f'web/public/ocr/{lang}.traineddata.gz').read_bytes()))
      - run: python -m unittest -v
      - name: Windows instalador y dos portables
        if: runner.os == 'Windows'
        run: |
          python -m PyInstaller --noconfirm --windowed --name "Marco PDF" --add-data "tessdata;tessdata" --add-data "web/src/translations.json;web/src" app.py
          Copy-Item LICENSE,NOTICE,README.md,THIRD_PARTY.md,CHANGELOG.md,CONTRIBUTING.md,SECURITY.md -Destination 'dist/Marco PDF'
          Copy-Item docs,assets,licenses -Destination 'dist/Marco PDF' -Recurse
          & 'C:/Program Files (x86)/Inno Setup 6/ISCC.exe' packaging/windows.iss
          if ($LASTEXITCODE -ne 0) { throw 'FallÃ³ el instalador Windows.' }
          python packaging/build_portable.py
          $check = Start-Process -FilePath (Resolve-Path dist/Marco-PDF-Portable.exe) -ArgumentList '--self-test', (Join-Path $PWD 'portable-report.json') -WindowStyle Hidden -Wait -PassThru
          if ($check.ExitCode -ne 0) { throw 'FallÃ³ el EXE portable.' }
          Get-Content portable-report.json
          python packaging/build_web_portable.py
          python packaging/check_web_portable.py dist/Marco-PDF-Web-Portable.exe
      - name: Instalador Linux
        if: runner.os == 'Linux'
        run: |
          python -m PyInstaller --noconfirm --windowed --name "Marco PDF" --add-data "tessdata:tessdata" --add-data "web/src/translations.json:web/src" app.py
          cp LICENSE NOTICE README.md THIRD_PARTY.md CHANGELOG.md CONTRIBUTING.md SECURITY.md 'dist/Marco PDF/'
          cp -R docs assets licenses 'dist/Marco PDF/'
          xvfb-run python -c 'from app import MarcoPDF; a=MarcoPDF(); a.update(); a.ui_language.set("FranÃ§ais"); a.change_language(); a.destroy()'
          bash packaging/linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: final-${{ runner.os }}
          path: |
            dist/Marco-PDF-Portable.exe
            dist/Marco-PDF-Web-Portable.exe
            dist/Marco-PDF-Windows-Instalador.exe
            dist/Marco-PDF-Linux-amd64.deb
            dist/Marco-PDF-Linux-Portable.tar.gz
          if-no-files-found: error
  android:
    needs: web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: web-assets
          path: web/dist
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.25.0'
          run_install: false
      - run: pnpm install --frozen-lockfile
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: APK firmado con los tres idiomas
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          pnpm exec cap sync android
          echo "$ANDROID_KEYSTORE" | base64 --decode > android/app/marco-pdf.p12
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk
          cp app/build/outputs/apk/release/app-release.apk ../../Marco-PDF-Android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: final-android
          path: Marco-PDF-Android.apk
  publish:
    needs: [web, desktop, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: final-*
          path: artifacts
          merge-multiple: true
      - name: Verificar nueve paquetes, documentación, fuente y sumas
        run: python scripts/distribution.py finalize artifacts
      - name: Publicar solo después de todas las comprobaciones
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          version="$(python -c 'import json; print(json.load(open("project.json"))["version"])')"
          name="$(python -c 'import json; print(json.load(open("project.json"))["name"])')"
          tag="v$version"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "$tag" ]; then echo 'Etiqueta y versión no coinciden'; exit 1; fi
          gh release create "$tag" artifacts/* --draft --target "$GITHUB_SHA" --title "$name $version" --notes-file "docs/releases/$tag.md"
          gh release edit "$tag" --draft=false --latest
